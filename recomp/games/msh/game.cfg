#
# Marvel Super Heroes (Capcom 1995, CPS-2 arcade board): per-game settings read by the cps2recomp toolkit
# (Makefile, tools and launcher via tools/gamecfg.py).

name = Marvel Super Heroes
# The series the collection's launcher puts it under, with the other games of it
series = Marvel
# What the window is called (the name stays the folder the player's settings are kept under)
title = Marvel Super Heroes Recomp
id = msh
app_id = io.github.tmcleroy.msh
disclaimer = Not affiliated with Capcom or Marvel.

# The ROM set this port is made from, as arcade ROM collections name it, and the name the launcher shows.
# msh is the parent set, and the one FBNeo and Fightcade play (the USA set, mshu, is the same revision).
rom_set = msh
rom_parent =
rom_name = Marvel Super Heroes (Europe 951024)

# The set's files, each with its CRC32 (file:crc ...), in the order they sit on the board.
# program: the 68000's ROMs (16-bit words). graphics: four files side by side per row (64-bit words).
# sound_program: the Z80's ROMs. samples: the QSound chip's. key: the board's cipher key.
program = mshe.03e:bd951414 mshe.04e:19dd42f2 msh.05:6a091b9e msh.06b:803e3fa4 msh.07a:c45f8e27 msh.08a:9ca6f12c msh.09a:82ec27af msh.10b:8d931196
graphics = msh.13m:09d14566 msh.15m:ee962057 msh.17m:604ece14 msh.19m:94a731e8 msh.14m:4197973e msh.16m:438da4a0 msh.18m:4db92d94 msh.20m:a2b0c6c0
sound_program = msh.01:c976e6f9 msh.02:ce67d0d9
samples = msh.11m:37ac6d30 msh.12m:de092570
key = msh.key:b494368e

# Other sets of the same game this port plays as well: other regions whose program is the same code as this set's
# (the region in the header, or in one instruction: region_at), with the same graphics and sound. One a line:
# set | name | its program files | its key.
other_set = mshu | Marvel Super Heroes (USA 951024) | mshu.03:d2805bdd mshu.04:743f96ff msh.05:6a091b9e msh.06b:803e3fa4 msh.07a:c45f8e27 msh.08a:9ca6f12c msh.09a:82ec27af msh.10b:8d931196 | mshu.key:745c1bee
other_set = mshjr1 | Marvel Super Heroes (Japan 951024) | mshj.03f:ff172fd2 mshj.04f:ebbb205a msh.05:6a091b9e msh.06b:803e3fa4 msh.07a:c45f8e27 msh.08a:9ca6f12c msh.09a:82ec27af msh.10b:8d931196 | mshj.key:888761ac
other_set = msha | Marvel Super Heroes (Asia 951024) | msha.03e:ec84ec44 msha.04e:098b8503 msh.05:6a091b9e msh.06b:803e3fa4 msh.07a:c45f8e27 msh.08a:9ca6f12c msh.09a:82ec27af msh.10b:8d931196 | msha.key:00f3f2ca
other_set = mshbr1 | Marvel Super Heroes (Brazil 951024) | mshb.03b:eb16165b mshb.04b:94fb3c97 msh.05:6a091b9e msh.06b:803e3fa4 msh.07a:c45f8e27 msh.08a:9ca6f12c msh.09a:82ec27af msh.10b:8d931196 | mshb.key:92196837
# The program's words where these sets and this one differ as the game reads them (both as on the chips and
# deciphered: the region, the checksum and the like; elsewhere only the cipher's other view differs). Online, the
# host sends its own, so two players with different sets play as the host's.
online_words = 0000C2 0000D0 0000D2
# (and the bytes the boot's ROM check adds up, every 4,095th of each 512 KB as on the chips, where these differ)
online_words = 000000 000FFE 001FFE 002FFC 004FFA 007FF8 008FF6 009FF6 00AFF4 00BFF4 00CFF2 00DFF2
online_words = 00EFF0 00FFF0 010FEE 011FEE 012FEC 013FEC 014FEA 015FEA 016FE8 017FE8 019FE6 01AFE4
online_words = 01BFE4 01CFE2 01DFE2 01FFE0 020FDE 021FDE 022FDC 023FDC 024FDA 025FDA 026FD8 027FD8
online_words = 028FD6 029FD6 02AFD4 02BFD4 02CFD2 02DFD2 02EFD0 02FFD0 030FCE 031FCE 032FCC 033FCC
online_words = 035FCA 036FC8 037FC8 038FC6 039FC6 03AFC4 03BFC4 03CFC2 03DFC2 03EFC0 03FFC0 041FBE
online_words = 042FBC 043FBC 044FBA 045FBA 046FB8 047FB8 048FB6 049FB6 04AFB4 04CFB2 04DFB2 04EFB0
online_words = 04FFB0 050FAE 051FAE 052FAC 054FAA 05CFA2 05DFA2 060F9E 061F9E 062F9C 066F98 068F96
online_words = 070F8E 071F8E 072F8C 073F8C 074F8A 075F8A 076F88 077F88 07AF84 07BF84 07CF82 081FFE
online_words = 082FFC 083FFC 084FFA 086FF8 087FF8 088FF6 08AFF4 08BFF4 08CFF2 08DFF2 08EFF0 08FFF0
