#
# Darkstalkers: The Night Warriors (Capcom 1994, CPS-2 arcade board): per-game settings read by the
# cps2recomp toolkit (Makefile, tools and launcher via tools/gamecfg.py).

name = Darkstalkers
# The series the collection's launcher puts it under, with the other games of it
series = Darkstalkers
# What the window is called (the name stays the folder the player's settings are kept under)
title = Darkstalkers Recomp
id = dstlk
app_id = io.github.tmcleroy.darkstalkers
disclaimer = Not affiliated with Capcom.

# Features whose switch is on the launcher's first page, under "Full screen": name | title | what it says
# The ROM set this port is made from, as arcade ROM collections name it, and the name the launcher shows
rom_set = dstlk
# (a parent set itself)
rom_parent = dstlk
rom_name = Darkstalkers: The Night Warriors (Europe 940705)

# The set's files, each with its CRC32 (file:crc ...), in the order they sit on the board.
program = vame.03a:004c9cff vame.04a:ae413ff2 vame.05a:60678756 vame.06a:912870b3 vame.07a:dabae3e8 vame.08a:2c6e3077 vame.09a:f16db74b vame.10a:701e2147
graphics = vam.13m:c51baf99 vam.15m:3ce83c77 vam.17m:4f2408e0 vam.19m:9ff60250 vam.14m:bd87243c vam.16m:afec855f vam.18m:3a033625 vam.20m:2bff6a89
sound_program = vam.01:64b685d5 vam.02:cf7c97c7
samples = vam.11m:4a39deb2 vam.12m:1a3e5c03
key = dstlk.key:cfa46dec

# Made from Night Warriors' program: its sources are built too (their places, where they are in this game, in
# family.h)
sources = nwarr

# Where the game's code ends in the 68000's ROM (hex): the translator does not look past this
code_end = 120000

# Features that help made-up play get far when looking for the game's code ('make explore')
explore_features = free_play,no_damage,one_hit
# ... and with which one made-up player wins every match, for the one-player game to its end
explore_ladder_features = free_play,no_damage,one_hit,infinite_time

# check_release.sh: the ladder is played at the board's slowest speed (Game speed: Turbo 1): at the faster ones the
# frames fill the processor, and where the interrupt is taken (the interpreter between instructions, translated code
# between blocks) moves the random number, so the two builds' ladders part (26,191 of 30,000 pictures; as Super
# Turbo's, games/ssf2t/PROGRESS.md)
release_features = free_play,no_damage,one_hit,board_turbo=1

# Capcom's video library, native in the toolkit (video/lifts.cpp, docs/NATIVE_VIDEO.md): where this game's copy of
# each part is. video_palette_commit: the routine, and its version (a CRC-32 of its instruction words, operands left
# out); video_writes: the instructions that write the video's registers (the palette's, the object registers, the object
# bank, the scrolls and layers: the toolkit checks each is a move or clr it reads)
video_writes = 0000C2 0000E8 0000F0 0000F8 000100 000108 000110 000118 000120 000128 000130 000138
video_writes = 000140 000168 000170 00017E 000186 00031E 000344 000352 000360 00036E 00037C 0007D4
video_writes = 0007F0 0007FC 000804 00080C 000814 00081C 000824 00082C 000834 00083C 000844 00084C
video_writes = 00089E 0008A6 00180E 001854 00188A 0018AA 0041DE 0041F2 0041F8 004200 0043C4 0043E2
video_writes = 00443A 004454 02A77A 02B84E 02C02E 0FC42E

# The games whose stages it shows, each run from its own stage code alone (fight/all_guests.h, in that order, and
# fight/guest_stages.h; their sets from their own game.cfg). None is needed to play: without them, only this game's.
guests = vampire_savior sfa2 sfa3 ssf2t sfa nwarr msh xmvsf mshvsf mvsc xmcota pocket_fighter cybots
