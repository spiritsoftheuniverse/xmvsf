#
# Alien vs. Predator (Capcom 1994, CPS-2 arcade board): per-game settings read by the cps2recomp toolkit
# (Makefile, tools and launcher via tools/gamecfg.py).

name = Alien vs. Predator
# What the window is called (the name stays the folder the player's settings are kept under)
title = Alien vs. Predator Recomp
# The group the collection's launcher puts it under, with the other games of its kind (game.cfg's series)
series = Beat-'em-ups
id = avsp
app_id = io.github.tmcleroy.alienvspredator
disclaimer = Not affiliated with Capcom.

# The ROM set this port is made from, as arcade ROM collections name it, and the name the launcher shows.
# avspu is the USA release of the one revision (940520); the other regions differ only in their words.
rom_set = avspu
rom_parent = avsp
rom_name = Alien vs. Predator (USA 940520)

# The set's files, each with its CRC32 (file:crc ...), in the order they sit on the board.
program = avpu.03d:42757950 avpu.04d:5abcdee6 avp.05d:fbfb5d7a avp.06:190b817f
graphics = avp.13m:8f8b5ae4 avp.15m:b00280df avp.17m:94403195 avp.19m:e1981245 avp.14m:39933b1e avp.16m:85412860 avp.18m:2e2beb06 avp.20m:e4798d1a
sound_program = avp.01:2d3b4220
samples = avp.11m:83499817 avp.12m:f4110d49
key = avspu.key:4e68e346

# Other sets of the same game this port plays as well: other regions whose program is the same code as this set's
# (the region in the header, or in one instruction: region_at), with the same graphics and sound. One a line:
# set | name | its program files | its key.
other_set = avsp | Alien vs. Predator (Europe 940520) | avpe.03d:774334a9 avpe.04d:7fa83769 avp.05d:fbfb5d7a avp.06:190b817f | avsp.key:e69fa35b
other_set = avspj | Alien vs. Predator (Japan 940520) | avpj.03d:49799119 avpj.04d:8cd2bba8 avp.05d:fbfb5d7a avp.06:190b817f | avspj.key:3d5ccc08
other_set = avspa | Alien vs. Predator (Asia 940520) | avpa.03d:6c1c1858 avpa.04d:94f50b0c avp.05d:fbfb5d7a avp.06:190b817f | avspa.key:728efc00
other_set = avsph | Alien vs. Predator (Hispanic 940520) | avph.03d:3e440447 avph.04d:af6fc82f avp.05d:fbfb5d7a avp.06:190b817f | avsph.key:cae7b680
# Where the region is put in a variable (move.w #region,d16(a5)), not read from the header: with another set the
# variable is given that set's region once the instruction is past (the translated code has this set's).
region_at = 000CAC
# The program's words where these sets and this one differ as the game reads them (both as on the chips and
# deciphered: the region, the checksum and the like; elsewhere only the cipher's other view differs). Online, the
# host sends its own, so two players with different sets play as the host's.
online_words = 000CAE

# Three players, and what the game calls its three buttons (the launcher's Controllers page shows these)
players = 3
buttons = Attack | Jump | Shoot

# Where the game's code ends in the 68000's ROM (hex): the translator does not look past this
code_end = 200000

# Features that help made-up play get far when looking for the game's code ('make explore')
explore_features = free_play

# Capcom's video library, native in the toolkit (video/lifts.cpp, docs/NATIVE_VIDEO.md): where this game's copy of
# each part is. video_palette_commit: the routine, and its version (a CRC-32 of its instruction words, operands left
# out); video_writes: the instructions that write the video's registers (the palette's, the object registers, the object
# bank, the scrolls and layers: the toolkit checks each is a move or clr it reads)
video_writes = 0005A4 0005B4 0005BC 0005C4 0005CC 0005D4 0005F8 000600 000608 000610 000618 000620
video_writes = 000660 000668 000670 000678 00080C 00082C 00083A 000848 000856 000864 0009DA 000A12
video_writes = 000C0E 000C78 000E0E 000E24 000E2C 000E34 000E3C 000E44 000E4C 000EBC 000EC4 001228
video_writes = 00123C 001242 0012EC 0012FA 001308 001316 001324 001332 001340 00134E 00135C 00136A
video_writes = 001378
