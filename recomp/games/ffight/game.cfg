#
# Final Fight (Capcom 1989, CPS-1 arcade board): per-game settings read by the cps2recomp toolkit (Makefile, tools and
# launcher via tools/gamecfg.py).

name = Final Fight
# What the window is called (the name stays the folder the player's settings are kept under)
title = Final Fight Recomp
# The group the collection's launcher puts it under, with the other games of its kind (game.cfg's series)
series = Beat-'em-ups
id = ffight
app_id = io.github.tmcleroy.finalfight
disclaimer = Not affiliated with Capcom.

# The ROM set this port is made from, as arcade ROM collections name it, and the name the launcher shows.
# ffight is the World release, the parent set.
rom_set = ffight
rom_parent = ffight
rom_name = Final Fight (World, set 1)

# The board: a classic CPS-1 with no QSound (machine/romset.h), its 68000 at 10 MHz (MAME's cps1_10MHz). Its
# CPS-B-04: layer control, the four priority masks, palette control, the layer enable bits (byte offsets, hex), then
# its ID register and the value it gives there (MAME's CPS_B_04).
board = cps1-classic pairs=2
cpu_clock = 10
cps_b = 2E 26 30 28 32 2A 02 04 08 20 0004
# Its graphics mapper (the PAL S224B, as MAME's table has it): one 0x8000-tile bank.
gfx_map = 8000 | objects:0-43ff:0 scroll1:4400-4bff:0 scroll3:4c00-5fff:0 scroll2:6000-7fff:0
# The DIP switches (banks A, B and C, hex), as the boards left the factory: 1 coin 1 credit, difficulty 1 normal (4),
# difficulty 2 normal (2), bonus life 100K, 2 lives, demo sound on, continues allowed.
dip = FF F4 9F
# The Board page (the menu's and the launcher's): the DIP switches by name, each "As the board is set" (dip, above)
# unless chosen. name | title | bank:bits | description | choice=value ... (MAME's ffight inputs). The board works out
# the coinage, difficulties, bonus life, free play, lives and continue from them once, as it starts (000D46); only
# the demonstrations' sound and the flip are read every frame (000E42).
board_option_1 = board_difficulty1 | Difficulty 1 | B:0-2 | How hard enemies fight. A new board: 3 (normal). Takes effect after Reset: the board reads it as it starts. | 0 (easiest)=7 | 1=6 | 2=5 | 3 (normal)=4 | 4=3 | 5=2 | 6=1 | 7 (hardest)=0
board_option_2 = board_difficulty2 | Difficulty 2 | B:3-4 | Enemy aggression and spawns. A new board: normal. Takes effect after Reset: the board reads it as it starts. | Easy=3 | Normal=2 | Hard=1 | Hardest=0
board_option_3 = board_lives | Lives | C:0-1 | Lives each credit starts with. A new board: 2. Takes effect after Reset: the board reads it as it starts. | 1=0 | 2=3 | 3=2 | 4=1
board_option_4 = board_bonus | Bonus life | B:5-6 | Score needed for an extra life. A new board: 100,000. Takes effect after Reset: the board reads it as it starts. | 100,000=3 | 200,000=2 | 100,000 & every 200,000=1 | None=0
board_option_5 = board_continue | Continue | C:6 | Whether a lost game can be continued. A new board: yes. Takes effect after Reset: the board reads it as it starts. | No=1 | Yes=0
board_option_6 = board_demo_sound | Demo sound | C:5 | Whether the attract mode plays sound. A new board: on. The board reads it all the time: it applies at once, as the game next uses it. | Off=1 | On=0
board_option_7 = board_two_coins | 2 coins to start | A:6 | Two credits to start a game, one to continue. A new board: off. Takes effect after Reset: the board reads it as it starts. | Off=1 | On=0

# The set's files, each with its CRC32 (file:crc ...), in the order they sit on the board.
# program: the 68000's ROMs: two pairs of files giving the even and odd bytes (board's pairs=2), then a 16-bit
# little-endian ROM (ff-32m.8h). graphics: four files side by side (64-bit words). sound_program: the Z80's ROM.
# samples: the OKI MSM6295's. No key file: nothing is enciphered.
program = ff_36.11f:f9a5ce83 ff_42.11h:65f11215 ff_37.12f:e1033784 ffe_43.12h:995e968a ff-32m.8h:c747696e
graphics = ff-5m.7a:9c284108 ff-7m.9a:a7584dfb ff-1m.3a:0b605e44 ff-3m.5a:52291cd2
sound_program = ff_09.12b:b8367eb5
samples = ff_18.11c:375c66e7 ff_19.12c:1ef137f9

# Two players, and what the game calls its two buttons (the launcher's Controllers page shows these)
players = 2
buttons = Attack | Jump

# Where the game's code ends in the 68000's ROM (hex): the translator does not look past this
code_end = 100000

# Capcom's video library, native in the toolkit (video/lifts.cpp, docs/NATIVE_VIDEO.md): video_writes, the
# instructions that write the video's registers (CPS-A's, and CPS-B's layer control, priority masks and palette
# control).
video_writes = 000554 00055C 000564 00056C 00057E 000584 00058C 000594 0005F0 000602 000614 000644
video_writes = 00064A 000650 000666 00067A 0006B0 0006B6 0006BC 0006D8 0021F6 0021FE 002206 05DAA0
video_writes = 05DAA8 05E010 05E018 05E7D0 05E7D8 05E7E0 05E7E8 05E7F0 05E7F8 05E800 05E808 05EB7C
video_writes = 05EB84

# What make explore turns on while it runs the game, so it reaches the cheat-guarded paths too
explore_features = free_play,infinite_health,infinite_time,infinite_lives
