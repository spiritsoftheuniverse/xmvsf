name: DHC C++11 isolation tests
on:
  pull_request:
    paths:
      - 'dev/dhc/**'
      - 'BUILD_TEST.bat'
      - 'RUN_TEST.bat'
      - 'dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_13*'
      - 'dev/stable/buildtree/src/intf/input/sdl/xmvsf_stage87_137*'
  push:
    branches:
      - 'feature/dhc-mvc2-stage87'
jobs:
  pure-dhc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate TEST launcher routing and build-script syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n dev/dhc/BUILD_TEST.sh
          grep -Fq 'MAKELEVEL=1 make' dev/dhc/BUILD_TEST.sh
          grep -Fq 'src/burner/sdl/main.cpp' dev/dhc/BUILD_TEST.sh
          test -f dev/stable/buildtree/src/burner/sdl/xmvsf_stage87_153_training_options.h
          grep -Fq 'xm257LoadTrainingOptions' dev/stable/buildtree/src/burner/sdl/main.cpp
          grep -Fq 'xm257SaveTrainingOptions' dev/stable/buildtree/src/burner/sdl/xmvsf_stage23_ui.h
          grep -Fq 'XM87.153 TRAINING_PLAYER_SELECT_RESTORED' dev/stable/buildtree/src/burner/sdl/xmvsf_stage23_engine.h
          grep -Fq 'xmvsfu_training_options.cfg' dev/stable/buildtree/src/burner/sdl/xmvsf_stage87_153_training_options.h
          grep -Fq 'ATTACK DURATION' dev/stable/buildtree/src/burner/sdl/xmvsf_stage23_ui.h
          grep -Fq 'xm30NativeAttackFamily' dev/stable/buildtree/src/burner/sdl/xmvsf_stage30_frame_data.h
          grep -Fq 'nativeAction=xm23::r16(c,base+0x60)' dev/stable/buildtree/src/burner/sdl/xmvsf_stage23_engine.h
          test -f dev/dhc/tests/test_dhc_frame_duration_154.cpp
          grep -Fq 'XM87.153 TRAINING_OPTIONS_SAVED' dev/dhc/BUILD_TEST.sh
          if grep -Fq 'cmp -s' dev/dhc/BUILD_TEST.sh; then
            echo 'ERROR: cmp dependency is not installed in user MSYS2' >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('dev/dhc/BUILD_TEST.sh').read_text().splitlines()
          starts=[i for i,line in enumerate(lines) if line.startswith('MAKELEVEL=1 make')]
          assert len(starts)==1, 'Expected single two-pass builder command'
          stop=next((i for i in range(starts[0], min(starts[0]+16,len(lines)))
                     if lines[i].strip().endswith(' all')),None)
          assert stop is not None,'make command never terminates in all'
          segment=lines[starts[0]:stop+1]
          assert all(line.endswith(chr(92)) and not line.endswith(chr(92)*2) for line in segment[:-1]), segment
          assert segment[-1].strip().endswith('all'), segment
          PY
          grep -Fq 'BUILD_TEST.sh' BUILD_TEST.bat
          grep -Fq 'XMVSF_Test_87_156.exe' RUN_TEST.bat
          grep -Fq 'XM87139_PROBE_DIR' RUN_TEST.bat
          grep -Fq 'XM87140_CHAT_LOG' RUN_TEST.bat
          grep -Fq 'xm87140ChatOverlay(sdlRenderer);' dev/stable/buildtree/src/intf/video/sdl/vid_sdl2.cpp
          grep -Fq 'XM87140Chat::state().frame' dev/stable/buildtree/src/burn/drv/capcom/cps_run.cpp
          grep -Fq 'XM87142::state().frame' dev/stable/buildtree/src/burn/drv/capcom/cps_run.cpp
          grep -Fq 'XM87143Queue::state().prepare' dev/stable/buildtree/src/burn/drv/capcom/cps_run.cpp
          grep -Fq 'DHC QUEUED ' dev/stable/buildtree/src/burner/sdl/xmvsf_stage87_140_super_chat.h
          grep -Fq 'XM87144::state().frame' dev/stable/buildtree/src/burn/drv/capcom/cps_run.cpp
          grep -Fq 'XM87144_DHC_NATIVE_TEST=1' RUN_TEST.bat
          grep -Fq 'XM87156_PROOF_NATIVE=1' RUN_TEST.bat
          grep -Fq 'PROOF_156_ROM_HP_HK_NATIVE_3200_ACCEPTED' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_144_native_handoff.h
          grep -Fq '0x18u:0x03u' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_144_native_handoff.h
          test -f dev/dhc/tests/test_dhc_native_proof_156.cpp
          test -f dev/dhc/tests/test_dhc_dual_ken_supers_155.cpp
          grep -Fq 'QCF+LP+MP queues Ken SHORYUREPPA' RUN_TEST.bat
          grep -Fq 'QCF+LK+MK queues Ken SHINRYUKEN' RUN_TEST.bat
          grep -Fq 'DHC_152_ROM_2C04_WRONG_ACTION_ABORT_NO_ROLLBACK' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_144_native_handoff.h
          grep -Fq 'ken2E00_D6722_ready' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_144_native_handoff.h
          grep -Fq 'ken2E02_D6976_ready' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_144_native_handoff.h
          test -f dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_144_native_handoff.h
          grep -Fq 'xmvsf_stage87_144_native_handoff.h' dev/dhc/BUILD_TEST.sh
          # 87.146 retired the forced outgoing animation; the builder
          # must not require that old binary marker after a successful link.
          if grep -Fq "'DHC_APPROVED_ROM_OUTGOING_ACTION' \"\$BUILT\"" dev/dhc/BUILD_TEST.sh; then
            echo 'ERROR: obsolete forced-tag marker still blocks a successful build' >&2
            exit 1
          fi
          grep -Fq 'required_markers=(' dev/dhc/BUILD_TEST.sh
          grep -Fq 'TEST executable is missing compiled 87.156 marker' dev/dhc/BUILD_TEST.sh
          grep -Fq 'DHC_NATIVE_TAG_CONTROLLER_08_ARMED' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_144_native_handoff.h
          grep -Fq 'NATIVE_CONTROLLER_ACCEPTED_OUTGOING_3200' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_144_native_handoff.h
          grep -Fq 'NATIVE_TAG_CONTROLLER_REJECTED_12F' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_144_native_handoff.h
          grep -Fq 'DHC_ROM_TAG_3200_AFTER_CONTROLLER_ACCEPT' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_144_native_handoff.h
          grep -Fq 'wb(ram,p+0xD6u,0x14u);' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_144_native_handoff.h
          grep -Fq 'DHC_NATIVE_EXIT_02_WATCHDOG_RECOVERY' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_144_native_handoff.h
          grep -Fq 'ROM_REASSERTED_RYU_HADOKEN_AFTER_TAG_3200' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_144_native_handoff.h
          grep -Fq 'DHC_KEN_2A0C_ATTACK_SUPPRESSED_IMMEDIATE_2A08' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_144_native_handoff.h
          grep -Fq 'KEN_ROM_NONATTACKING_2A08_CONFIRMED' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_144_native_handoff.h
          grep -Fq 'DHC_NATIVE_INPUT_DISPATCH_ACCEPTED' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_144_native_handoff.h
          grep -Fq 'KEN_ENTRY_ATTACK_REASSERTED_AFTER_CANCEL' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_144_native_handoff.h
          grep -Fq 'DHC_KEN_NATIVE_QCF_INPUT_BEGIN' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_144_native_handoff.h
          grep -Fq 'dhcInput.active' dev/stable/buildtree/src/burn/drv/capcom/cps_run.cpp
          grep -Fq '0xD6976u' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_143_super_queue.h
          grep -Fq 'TOURNAMENT_RULES_INCOMPLETE' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_149_tournament_rules_audit.h
          grep -Fq 'XM87149Rules::state().frame' dev/stable/buildtree/src/burn/drv/capcom/cps_run.cpp
          grep -Fq 'if(loaded()){Apply();return;}' dev/stable/buildtree/src/burner/sdl/xmvsf_stage87_55_rule_mode.h
          grep -Fq 'set "XM8786_STORM_BUTTON_TEST=1"' RUN_TEST.bat
          grep -Fq 'set "XM8795_NATIVE_HIT_TEST=1"' RUN_TEST.bat
          grep -Fq 'set "XM8796_DIZZY_HANDOFF_TEST=1"' RUN_TEST.bat
          grep -Fq 'set "XM8799_GROUND_DEFENSE_TEST=1"' RUN_TEST.bat
          grep -Fq 'XM87149_TOURNAMENT_AUDIT' RUN_TEST.bat
          if grep -Eq '^set "XM878[0345]_' RUN_TEST.bat; then
            echo 'ERROR: obsolete flying-screen writer enabled in TEST' >&2
            exit 1
          fi
          grep -Fq 'BLOCK_NOT_NATIVE_2A28_SUPER_MODE' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_144_native_handoff.h
          grep -Fq 'REFERENCE_REAL_ROM_NORMAL_TAG' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_144_native_handoff.h
          grep -Fq 'DHC_NATIVE_TAG_CONTROLLER_08_ARMED' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_144_native_handoff.h
          grep -Fq 'NATIVE_TAG_CONTROLLER_REJECTED_12F' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_144_native_handoff.h
          # 87.156 accepts BOTH native 2A02 and 2A28 observed on actual
          # Ryu supers, but never forces either mode for incoming Ken.
          grep -Fq 'rw(ram,p+0xA0u)!=0x2A28u' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_144_native_handoff.h
          grep -Fq 'rw(ram,p+0xA0u)!=0x2A02u' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_144_native_handoff.h
          grep -Fq 'inputForFrame' dev/stable/buildtree/src/burn/drv/capcom/cps_run.cpp
          grep -Fq 'nativeD6' dev/stable/buildtree/src/burner/sdl/xmvsf_stage87_139_probe.h
          if grep -Fq 'KEN_NATIVE_SUPER_OPENING_SCRIPT_PRIMED' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_144_native_handoff.h; then
            echo 'ERROR: isolated Ken 2C sprite injection returned' >&2
            exit 1
          fi
          grep -Fq 'XM87142_ROM_TRACE' RUN_TEST.bat
          grep -Fq 'mappedNative?nativeStart' dev/stable/buildtree/src/burner/sdl/xmvsf_stage87_140_super_chat.h
          grep -Fq 'RYU SHINKUU TATSUMAKI' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_143_super_queue.h
          grep -Fq 'XM87143Queue::state().prepare' dev/stable/buildtree/src/burn/drv/capcom/cps_run.cpp
          grep -Fq 'XM87143Queue::state().select' dev/stable/buildtree/src/burner/sdl/xmvsf_stage87_140_super_chat.h
          grep -Fq 'if(event.type==SDL_KEYDOWN && event.key.keysym.sym==SDLK_F10)' dev/stable/buildtree/src/burner/sdl/run.cpp
          grep -Fq '# F10_START armed' dev/stable/buildtree/src/burner/sdl/xmvsf_stage87_139_probe.h
          if grep -Fq 'XM87138Tag::state().frame(' dev/stable/buildtree/src/burn/drv/capcom/cps_run.cpp; then
            echo 'ERROR: 87.138 normal-tag gameplay mutation still hooked' >&2
            exit 1
          fi
          if grep -Fq 'releases\\87_132' BUILD_TEST.bat || grep -Fq 'releases\\87_132' RUN_TEST.bat; then
            echo 'ERROR: Historical 87.132 launcher dependency remains' >&2
            exit 1
          fi
      - name: Compile and execute isolated DHC tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/xmvsf-dhc-tests
          for t in dev/dhc/tests/test_dhc_*.cpp; do
            echo "Compiling $t"
            bin="/tmp/xmvsf-dhc-tests/$(basename "$t" .cpp)"
            g++ -std=c++11 -O2 -Wall -Wextra -pedantic "$t" -o "$bin"
            "$bin"
          done
          echo "All isolated DHC tests passed"
