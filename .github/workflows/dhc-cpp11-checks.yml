name: DHC C++11 isolation tests
on:
  pull_request:
    paths:
      - 'dev/dhc/**'
      - 'BUILD_TEST.bat'
      - 'RUN_TEST.bat'
      - 'dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_13*'
      - 'dev/stable/buildtree/src/intf/input/sdl/xmvsf_stage87_137*'
  push:
    branches:
      - 'feature/dhc-mvc2-stage87'
jobs:
  pure-dhc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate TEST launcher routing and build-script syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n dev/dhc/BUILD_TEST.sh
          grep -Fq 'MAKELEVEL=1 make' dev/dhc/BUILD_TEST.sh
          if grep -Fq 'cmp -s' dev/dhc/BUILD_TEST.sh; then
            echo 'ERROR: cmp dependency is not installed in user MSYS2' >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('dev/dhc/BUILD_TEST.sh').read_text().splitlines()
          starts=[i for i,line in enumerate(lines) if line.startswith('MAKELEVEL=1 make')]
          assert len(starts)==1, 'Expected single two-pass builder command'
          segment=lines[starts[0]:starts[0]+5]
          assert len(segment)==5, segment
          assert all(line.endswith(chr(92)) and not line.endswith(chr(92)*2) for line in segment[:4]), segment
          assert segment[-1].strip().endswith('all'), segment
          PY
          grep -Fq 'BUILD_TEST.sh' BUILD_TEST.bat
          grep -Fq 'XMVSF_Test_87_138.exe' RUN_TEST.bat
          if grep -Fq 'releases\\87_132' BUILD_TEST.bat || grep -Fq 'releases\\87_132' RUN_TEST.bat; then
            echo 'ERROR: Historical 87.132 launcher dependency remains' >&2
            exit 1
          fi
      - name: Compile and execute isolated DHC tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/xmvsf-dhc-tests
          for t in dev/dhc/tests/test_dhc_*.cpp; do
            echo "Compiling $t"
            bin="/tmp/xmvsf-dhc-tests/$(basename "$t" .cpp)"
            g++ -std=c++11 -O2 -Wall -Wextra -pedantic "$t" -o "$bin"
            "$bin"
          done
          echo "All isolated DHC tests passed"
