          replay_exe="$(grep -oE 'XMVSF_Test_87_[0-9]+\.exe' RUN_REPLAY.bat | head -1)"
          builder_exe="$(grep -oE 'XMVSF_Test_87_[0-9]+\.exe' dev/dhc/BUILD_TEST.sh | head -1)"
          if [[ -z "$test_exe" || "$test_exe" != "$replay_exe" ||
                "$test_exe" != "$builder_exe" ]]; then
            echo "ERROR: RUN_REPLAY.bat must target the current TEST executable ($test_exe), not a stale build" >&2
            exit 1
