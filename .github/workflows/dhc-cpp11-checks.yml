          grep -Fq '"%EXE%" xmvsfu -joy' RUN_REPLAY.bat
          grep -Fq 'XM8761_REPLAY_HOST_MODE=training' RUN_REPLAY.bat
          grep -Fq 'XM8761_REPLAY_STATUS_LOG=' RUN_REPLAY.bat
          grep -Fq 'XM87.163 REPLAY_DIRECT_BOOT' dev/stable/buildtree/src/burner/sdl/main.cpp
          grep -Fq 'XM8761_REPLAY_MODE' dev/stable/buildtree/src/burner/sdl/main.cpp
          grep -Fq 'PLAY_READY: native state loaded' dev/stable/buildtree/src/burner/sdl/xmvsf_stage87_61_replay.h
          grep -Fq 'PLAY_PROGRESS' dev/stable/buildtree/src/burner/sdl/xmvsf_stage87_61_replay.h
          grep -Fq 'XMVSF REPLAY COMPLETE' dev/stable/buildtree/src/burner/sdl/run.cpp
          grep -Fq 'XM8761_REPLAY_MODE=play' RUN_REPLAY.bat
          grep -Fq 'XM8761_REPLAY_INPUT_FILE' RUN_REPLAY.bat
          grep -Fq 'XM8761_REPLAY_STATE_FILE' RUN_REPLAY.bat
          grep -Fq 'XM87162ReplaySync::publish' dev/stable/buildtree/src/burner/sdl/run.cpp
