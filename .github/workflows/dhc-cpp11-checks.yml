name: DHC C++11 isolation tests
on:
  pull_request:
    paths:
      - 'dev/dhc/**'
      - 'BUILD_TEST.bat'
      - 'RUN_TEST.bat'
      - 'RUN_REPLAY.bat'
      - 'REPLAY.md'
      - 'dev/stable/buildtree/src/burner/sdl/main.cpp'
      - 'dev/stable/buildtree/src/burner/sdl/run.cpp'
      - 'dev/stable/buildtree/src/burner/sdl/xmvsf_stage87_61_replay.h'
      - 'dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_13*'
      - 'dev/stable/buildtree/src/intf/input/sdl/xmvsf_stage87_137*'
  push:
    branches:
      - 'feature/dhc-mvc2-stage87'
jobs:
  pure-dhc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate TEST launcher routing and build-script syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n dev/dhc/BUILD_TEST.sh
          grep -Fq 'MAKELEVEL=1 make' dev/dhc/BUILD_TEST.sh
          grep -Fq 'DEPEND=1' dev/dhc/BUILD_TEST.sh
          # Headers are already enumerated by FBNeo's .d dependency graph.
          # The original 5 -W switches recompiled these source files every run.
          if grep -Eq -- '-W[[:space:]]+src/' dev/dhc/BUILD_TEST.sh; then
            echo 'ERROR: unconditional TEST source recompile overrides returned' >&2
            exit 1
          fi
          grep -Fq '$(alldep)' dev/stable/buildtree/makefile.sdl2
          grep -Fq '%.d:' dev/stable/buildtree/makefile.sdl2
          grep -Fq 'DEPED' dev/stable/buildtree/makefile.sdl2 || true
          test -f dev/stable/buildtree/src/burner/sdl/xmvsf_stage87_153_training_options.h
          grep -Fq 'xm257LoadTrainingOptions' dev/stable/buildtree/src/burner/sdl/main.cpp
          grep -Fq 'xm257SaveTrainingOptions' dev/stable/buildtree/src/burner/sdl/xmvsf_stage23_ui.h
          grep -Fq 'XM87.153 TRAINING_PLAYER_SELECT_RESTORED' dev/stable/buildtree/src/burner/sdl/xmvsf_stage23_engine.h
          grep -Fq 'xmvsfu_training_options.cfg' dev/stable/buildtree/src/burner/sdl/xmvsf_stage87_153_training_options.h
          grep -Fq 'ATTACK DURATION' dev/stable/buildtree/src/burner/sdl/xmvsf_stage23_ui.h
          grep -Fq 'xm30NativeAttackFamily' dev/stable/buildtree/src/burner/sdl/xmvsf_stage30_frame_data.h
          grep -Fq 'nativeAction=xm23::r16(c,base+0x60)' dev/stable/buildtree/src/burner/sdl/xmvsf_stage23_engine.h
          test -f dev/dhc/tests/test_dhc_frame_duration_154.cpp
          grep -Fq 'XMVSF_Test_87_200.exe' dev/dhc/BUILD_TEST.sh
          if grep -Fq 'cmp -s' dev/dhc/BUILD_TEST.sh; then
            echo 'ERROR: cmp dependency is not installed in user MSYS2' >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('dev/dhc/BUILD_TEST.sh').read_text().splitlines()
          starts=[i for i,line in enumerate(lines) if line.startswith('MAKELEVEL=1 make')]
          assert len(starts)==1, 'Expected single two-pass builder command'
          stop=next((i for i in range(starts[0], min(starts[0]+16,len(lines)))
                     if lines[i].strip().endswith(' all')),None)
          assert stop is not None,'make command never terminates in all'
          segment=lines[starts[0]:stop+1]
          assert all(line.endswith(chr(92)) and not line.endswith(chr(92)*2) for line in segment[:-1]), segment
          assert segment[-1].strip().endswith('all'), segment
          PY
          grep -Fq 'BUILD_TEST.sh' BUILD_TEST.bat
          # A crashed or rejected Windows TEST build must always leave
          # the exact native compiler/linker transcript on disk.
          grep -Fq 'BUILDLOG=%LOGDIR%\BUILD_TEST.log' BUILD_TEST.bat
          grep -Fq 'BATCH RESULT: FAILURE' BUILD_TEST.bat
          grep -Fq 'BATCH RESULT: SUCCESS' BUILD_TEST.bat
          grep -Fq 'exec > >(tee -a "$LOG_FILE") 2>&1' dev/dhc/BUILD_TEST.sh
          grep -Fq 'XMVSF BUILD END rc=' dev/dhc/BUILD_TEST.sh
          grep -Fq 'LOG_DIR="$PROJECT/test/build_logs"' dev/dhc/BUILD_TEST.sh
          if grep -Eq '^\) 2>&1 \| awk' dev/dhc/BUILD_TEST.sh; then
            echo 'ERROR: awk compiler-warning filter must not truncate build logs' >&2
            exit 1
          fi
          grep -Fq 'XMVSF_Test_87_200.exe' RUN_TEST.bat
          grep -Fq 'XM87139_PROBE_DIR' RUN_TEST.bat
          grep -Fq 'XM87140_CHAT_LOG' RUN_TEST.bat
          grep -Fq 'xm87140ChatOverlay(sdlRenderer);' dev/stable/buildtree/src/intf/video/sdl/vid_sdl2.cpp
          grep -Fq 'XM87140Chat::state().frame' dev/stable/buildtree/src/burn/drv/capcom/cps_run.cpp
          grep -Fq 'XM87142::state().frame' dev/stable/buildtree/src/burn/drv/capcom/cps_run.cpp
          grep -Fq 'XM87143Queue::state().prepare' dev/stable/buildtree/src/burn/drv/capcom/cps_run.cpp
          grep -Fq 'DHC QUEUED ' dev/stable/buildtree/src/burner/sdl/xmvsf_stage87_140_super_chat.h
          grep -Fq 'XM87144::state().frame' dev/stable/buildtree/src/burn/drv/capcom/cps_run.cpp
          grep -Fq 'XM87144_DHC_NATIVE_TEST=1' RUN_TEST.bat
          grep -Fq 'XM87157_EARLY_CANCEL=1' RUN_TEST.bat
          grep -Fq 'PROOF_156_ROM_HP_HK_NATIVE_3200_ACCEPTED' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_144_native_handoff.h
          grep -Fq 'XM87177Chords::nativeKenTwoPunchMask()' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_144_native_handoff.h
          test -f dev/dhc/tests/test_dhc_rom_catalog_160.cpp
          test -f dev/dhc/tests/test_dhc_opening_front_187.cpp
          test -f dev/dhc/tests/test_dhc_full_attack_gate_188.cpp
          test -f dev/dhc/tests/test_dhc_super_family_189.cpp
          test -f dev/dhc/tests/test_dhc_reserve_ownership_192.cpp
          test -f dev/dhc/tests/test_dhc_deterministic_exit_193.cpp
          test -f dev/dhc/tests/test_dhc_native_passive_jump_entry_194.cpp
          test -f dev/dhc/tests/test_dhc_native_entry_arc_195.cpp
          test -f dev/dhc/tests/test_dhc_host_latch_cleanup_195.cpp
          test -f dev/dhc/tests/test_dhc_native_immediate_fall_196.cpp
          test -f dev/dhc/tests/test_dhc_cinematic_opponent_hold_197.cpp
          test -f dev/dhc/tests/test_dhc_ken_rom_owned_input_and_freeze_198.cpp
          grep -Fq 'XM87198_TEST_KEN_HCF_PRETAG_REJECTION set' RUN_TEST.bat
          grep -Fq 'XM87198_TEST_NATIVE_OFFENSE_RELEASE set' RUN_TEST.bat
          grep -Fq 'XM87198_TEST_KEN_HCF_PRETAG_REJECTION=1' RUN_REPLAY.bat
          grep -Fq 'XM87198_TEST_NATIVE_OFFENSE_RELEASE=1' RUN_REPLAY.bat
          grep -Fq 'xmvsf_stage87_198_native_super_freeze_cue.h' dev/dhc/BUILD_TEST.sh
          grep -Fq 'DHC_198_FREEZE_RELEASED_ON_NATIVE_KEN_FIRST_ATTACK' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_144_native_handoff.h
          grep -Fq 'KEN_HCF_ROM_PROVEN_0006_DHC_REFUSED_PRETAG' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_192_reserve_super_ownership.h
          grep -Fq 'XM87197_TEST_OPPONENT_FREEZE set' RUN_TEST.bat
          grep -Fq 'XM87197_TEST_OPPONENT_FREEZE=1' RUN_REPLAY.bat
          grep -Fq 'xmvsf_stage87_197_cinematic_opponent_hold.h' dev/dhc/BUILD_TEST.sh
          grep -Fq 'DHC_197_OPPONENT_FREEZE_AT_NATIVE_3200' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_144_native_handoff.h
          grep -Fq 'DHC_197_OPPONENT_FREEZE_RELEASED_ON_NATIVE_2E' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_144_native_handoff.h
          grep -Fq 'cinematicFreeze.beforeCPU' dev/stable/buildtree/src/burn/drv/capcom/cps_run.cpp
          grep -Fq 'XM87196_TEST_IMMEDIATE_NATIVE_FALL set' RUN_TEST.bat
          grep -Fq 'XM87196_TEST_IMMEDIATE_NATIVE_FALL=1' RUN_REPLAY.bat
          grep -Fq 'xmvsf_stage87_196_native_immediate_fall.h' dev/dhc/BUILD_TEST.sh
          grep -Fq 'DHC_196_TAG_LAG_SKIPPED_NATIVE_0212_FALL' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_144_native_handoff.h
          grep -Fq 'xmvsf_stage87_195_menu_gif.h' dev/stable/buildtree/src/burner/sdl/xmvsf_stage14_boot.h
          grep -Fq 'marvel-vs-capcom1-super-effect2.gif' dev/stable/buildtree/src/burner/sdl/xmvsf_stage87_195_menu_gif.h
          grep -Fq 'SDL_SetTextureColorMod(texture_,77,77,77)' dev/stable/buildtree/src/burner/sdl/xmvsf_stage87_195_menu_gif.h
          grep -Fq 'DHC_195_WRONG_ACTION_HOST_259_LATCH_RELEASED' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_144_native_handoff.h
          grep -Fq 'xmvsf_stage87_195_tag_latch_guard.h' dev/dhc/BUILD_TEST.sh
          grep -Fq 'XM87194_TEST_NATIVE_PASSIVE_JUMP set' RUN_TEST.bat
          grep -Fq 'XM87194_TEST_NATIVE_PASSIVE_JUMP=1' RUN_REPLAY.bat
          grep -Fq 'xmvsf_stage87_194_native_passive_jump_entry.h' dev/dhc/BUILD_TEST.sh
          grep -Fq 'DHC_194_REAL_NATIVE_LANDING_IDLE_BEFORE_RESERVE_SUPER' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_144_native_handoff.h
          grep -Fq 'XM87193_TEST_DETERMINISTIC_EXIT set' RUN_TEST.bat
          grep -Fq 'XM87193_TEST_DETERMINISTIC_EXIT=1' RUN_REPLAY.bat
          grep -Fq 'xmvsf_stage87_193_deterministic_exit_protocol.h' dev/dhc/BUILD_TEST.sh
          grep -Fq 'DHC_193_OUTGOING_2K_TO_NATIVE_2P_BEFORE_CPU_RESERVE_KEEPS_ORIGINAL_KK' dev/stable/buildtree/src/burn/drv/capcom/cps_run.cpp
          grep -Fq 'XM87192_TEST_RESERVE_OWNERSHIP=1' RUN_REPLAY.bat
          grep -Fq 'XM87192_TEST_RESERVE_OWNERSHIP set' RUN_TEST.bat
          grep -Fq 'xmvsf_stage87_192_reserve_super_ownership.h' dev/dhc/BUILD_TEST.sh
          grep -Fq 'DHC_192_RESERVE_NATIVE_ROM_2E_SUPER_ACCEPTED_AND_CATALOGED' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_144_native_handoff.h
          grep -Fq 'XM87191_TEST_OPEN_SUPER_LIFETIME set' RUN_TEST.bat
          grep -Fq 'XM87191_TEST_OPEN_SUPER_LIFETIME=1' RUN_REPLAY.bat
          grep -Fq 'xmvsf_stage87_191_super_lifetime_gate.h' dev/dhc/BUILD_TEST.sh
          grep -Fq 'DHC_191_NATIVE_SUPER_LIFETIME_FRESH_HANDOFF' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_144_native_handoff.h
          grep -Fq 'DHC_190_NATIVE_2E_ROOT_SCRIPT_REWIND_STILL_SUPER_ATTACK' dev/stable/buildtree/src/burner/sdl/xmvsf_stage87_140_super_chat.h
          grep -Fq 'DHC_190_ROM_FAMILY_FOLLOWUP_RECOGNIZED_TAG_UNVERIFIED' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_144_native_handoff.h
          grep -Fq 'XM87189_TEST_NATIVE_SUPER_FAMILY=1' RUN_REPLAY.bat
          grep -Fq 'xmvsf_stage87_189_native_super_family.h' dev/dhc/BUILD_TEST.sh
          grep -Fq 'XM87188_TEST_FULL_ATTACK=1' RUN_REPLAY.bat
          grep -Fq 'XM87188_TEST_FULL_ATTACK set' RUN_TEST.bat
          grep -Fq 'DHC_187_STARTUP_INPUT_CLOSED_NO_DEFERRED_TAG' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_187_opening_front.h
          grep -Fq 'DHC_187_STALE_ATTACK_REQUEST_EXPIRED_NO_PHYSICAL_EDGE' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_187_opening_front.h
          grep -Fq 'XM8761_REPLAY_DIR=' RUN_TEST.bat
          grep -Fq 'XM8761_REPLAY_MODE=off' RUN_TEST.bat
          grep -Fq 'XMVSF_Test_87_200.exe' RUN_REPLAY.bat
          # The replay launcher is a permanent first-class root entry point.
          # Never let point-version bumps strand it on a stale TEST executable.
          test -f RUN_REPLAY.bat
          test -f REPLAY.md
          test -f README.md
          test -f REPLAY_DATA_MODEL_MANIFESTO.md
          test -f dev/dhc/tools/VERIFY_REPLAY_V2.py
          grep -Fq 'UNSEALED_PREFIX' dev/dhc/tools/VERIFY_REPLAY_V2.py
          grep -Fq 'FINAL' REPLAY_DATA_MODEL_MANIFESTO.md
          grep -Fq 'UNSEALED' REPLAY_DATA_MODEL_MANIFESTO.md
          grep -Fq 'REPLAY_DATA_MODEL_MANIFESTO.md' README.md
          grep -Fq 'XM8764::finalizeRecording("APPLICATION_EXIT")' dev/stable/buildtree/src/burner/sdl/main.cpp
          grep -Fq 'std::atexit(finishAtNormalExit)' dev/stable/buildtree/src/burner/sdl/xmvsf_stage87_164_host_replay.h
          grep -Fq 'V2_MANIFEST_SEALED' dev/stable/buildtree/src/burner/sdl/xmvsf_stage87_164_host_replay.h
          grep -Fq 'V2_UNSEALED_PREFIX' dev/stable/buildtree/src/burner/sdl/xmvsf_stage87_164_host_replay.h
          grep -Fq 'V2_FINAL_TOTAL_MISMATCH' dev/stable/buildtree/src/burner/sdl/xmvsf_stage87_164_host_replay.h
          grep -Fq 'FINAL' dev/dhc/tests/test_dhc_host_replay_164.cpp
          grep -Fq 'finishAtNormalExit()' dev/dhc/tests/test_dhc_host_replay_164.cpp
          test -f dev/dhc/tests/test_dhc_replay_runner_163.cpp
          test -f dev/dhc/tests/test_dhc_host_replay_164.cpp
          test -f dev/stable/buildtree/src/burner/sdl/xmvsf_stage87_164_host_replay.h
          test -f dev/dhc/REPLAY_V2_HOST_TRANSITIONS.md
          grep -Fq 'XM8764V2' dev/stable/buildtree/src/burner/sdl/xmvsf_stage87_164_host_replay.h
          grep -Fq 'REPLAY_DIVERGED' dev/stable/buildtree/src/burner/sdl/xmvsf_stage87_164_host_replay.h
          grep -Fq 'HOST_MENU_STATE_CHANGED' dev/stable/buildtree/src/burner/sdl/xmvsf_stage87_164_host_replay.h
          grep -Fq 'XM8764_REPLAY_ROOT=' RUN_TEST.bat
          # F9 must keep the SAME red gameplay counter and file-location
          # discoverability as the old recorder, plus show it in boot menu.
          grep -Fq 'XM8764_REPLAY_ROOT=%PROJECT%\test\87.200\replays' RUN_TEST.bat
          grep -Fq 'XM8764_REPLAY_STATUS_FILE=' RUN_TEST.bat
          grep -Fq 'XM8764::recordingFrames()' dev/stable/buildtree/src/burner/sdl/run.cpp
          grep -Fq 'xm87166ReplayVisualStatus' dev/stable/buildtree/src/intf/video/sdl/vid_sdl2.cpp
          grep -Fq 'RECORDING %06u F9 STOP' dev/stable/buildtree/src/burner/sdl/xmvsf_stage14_boot.h
          grep -Fq 'RECORDING SAVED' dev/stable/buildtree/src/intf/video/sdl/vid_sdl2.cpp
          grep -Fq 'RECORD_SAVED total_frames=' dev/stable/buildtree/src/burner/sdl/xmvsf_stage87_164_host_replay.h
          grep -Fq 'requiresCheckpoint(host,c.lastRecordedHost)' dev/stable/buildtree/src/burner/sdl/xmvsf_stage87_164_host_replay.h
          grep -Fq 'recordingFrames()==1' dev/dhc/tests/test_dhc_host_replay_164.cpp
          grep -Fq 'saves==1u' dev/dhc/tests/test_dhc_host_replay_164.cpp
          grep -Fq '%PROJECT%\test\87.200\replays\latest.txt' RUN_REPLAY.bat
          grep -Fq 'dir /b /ad /o:-n' RUN_REPLAY.bat
          grep -Fq 'RECORD_SAVE_ERROR' dev/stable/buildtree/src/burner/sdl/xmvsf_stage87_164_host_replay.h
          grep -Fq 'V2_INPUT_FLUSH_OR_CLOSE_FAILED' dev/stable/buildtree/src/burner/sdl/xmvsf_stage87_164_host_replay.h
          grep -Fq 'XM8764_REPLAY_SESSION=' RUN_REPLAY.bat
          grep -Fq 'XM8764_FAST_FORWARD=32' RUN_REPLAY.bat
          grep -Fq 'XM8764::beforeFrame' dev/stable/buildtree/src/burner/sdl/run.cpp
          grep -Fq 'XM8764::fastFrames()' dev/stable/buildtree/src/burner/sdl/run.cpp
          # The actual custom boot selector initializes the existing SDL
          # window, then consumes the recorded semantic menu choice.
          grep -Fq 'XM8764::nextMode()' dev/stable/buildtree/src/burner/sdl/xmvsf_stage14_boot.h
          grep -Fq 'const int selectedMode=xmvsfBootSelector()' dev/stable/buildtree/src/burner/sdl/main.cpp
          grep -Fq 'const int selectedMode=xmvsfBootSelector(true)' dev/stable/buildtree/src/burner/sdl/main.cpp
          grep -Fq 'XM8764::toggleF9()' dev/stable/buildtree/src/burner/sdl/xmvsf_stage14_boot.h
          grep -Fq 'XM8764::checkpoint' dev/stable/buildtree/src/burner/sdl/xmvsf_stage87_105_training_reset.h
