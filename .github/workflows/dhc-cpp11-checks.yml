          grep -Fq 'XM8761::toggleF9(bDrvOkay!=0)' dev/stable/buildtree/src/burner/sdl/run.cpp
          grep -Fq 'XM8761::afterInput()' dev/stable/buildtree/src/burner/sdl/run.cpp
          grep -Fq 'XM87160_DISCOVER=1' RUN_TEST.bat
          grep -Fq 'XM87160_PRIVATE_ROM_DIR' RUN_TEST.bat
          grep -Fq '/local_rom_dump/' .gitignore
          grep -Fq 'XM87160::state().frame' dev/stable/buildtree/src/burn/drv/capcom/cps_run.cpp
          grep -Fq 'XM87160::state().exportPrivateCode' dev/stable/buildtree/src/burn/drv/capcom/cps_run.cpp
          grep -Fq 'UNVERIFIED_ROM_2E_SCRIPT' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_160_super_discovery.h
          grep -Fq 'EXCLUDE_VARIABLE_COMBINATION' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_160_super_discovery.h
          if grep -Fq 'if(u)return 8u;return 5u;' dev/stable/buildtree/src/burner/sdl/xmvsf_stage87_140_super_chat.h ||
             grep -Fq 'if(dir==last)continue;last=dir;' dev/stable/buildtree/src/burner/sdl/xmvsf_stage87_140_super_chat.h; then
            echo 'ERROR: misleading-indentation warnings returned to super-chat parser' >&2
            exit 1
          fi
          test -f dev/dhc/tests/test_dhc_native_proof_156.cpp
          test -f dev/dhc/tests/test_dhc_fast_ken_cancel_157.cpp
          grep -Fq 'XM87156_PROOF_NATIVE=0' RUN_TEST.bat
          grep -Fq 'FAST_157_KEN_2A08_CANCEL_TO_VERIFIED_ROM_IDLE' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_144_native_handoff.h
          grep -Fq 'FAST_157_KEN_NATIVE_TWO_BUTTON_EDGE' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_144_native_handoff.h
          test -f dev/dhc/tests/test_dhc_dual_ken_supers_155.cpp
          grep -Fq 'QCF+ANY TWO PUNCHES or QCF+3P queues Ken SHORYUREPPA' RUN_TEST.bat
          grep -Fq 'QCF+LK+MK queues Ken SHINRYUKEN' RUN_TEST.bat
          grep -Fq 'XM87187Front::wrongAction(rw(ram,p+0x60u))' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_144_native_handoff.h
          grep -Fq 'ken2E00_D6722_ready' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_144_native_handoff.h
          grep -Fq 'ken2E02_D6976_ready' dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_144_native_handoff.h
          test -f dev/stable/buildtree/src/burn/drv/capcom/xmvsf_stage87_144_native_handoff.h
          grep -Fq 'xmvsf_stage87_187_opening_front.h' dev/dhc/BUILD_TEST.sh
          # 87.146 retired the forced outgoing animation; the builder
          # must not require that old binary marker after a successful link.
          if grep -Fq "'DHC_APPROVED_ROM_OUTGOING_ACTION' \"\$BUILT\"" dev/dhc/BUILD_TEST.sh; then
            echo 'ERROR: obsolete forced-tag marker still blocks a successful build' >&2
            exit 1
          fi
          grep -Fq 'Build/link succeeded; publishing TEST binary' dev/dhc/BUILD_TEST.sh
